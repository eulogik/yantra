base_model: openbmb/MiniCPM5-1B
project: nanogent

training:
  method: qlora
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  max_seq_len: 8192
  stage1_sft_steps: 2000
  stage2_eg_opd_steps: 3000
  stage3_rte_steps: 1500
  learning_rate: 1.0e-4
  eg_opd_k: 50

eval:
  eval_set: eval/data/toolace_300.jsonl
  n_cases: 300
  seed: 42
  temperature: 0.0

# Realistic ranges (from HANDOFF §7). Eval report compares baseline vs
# expected (realistic) vs stretch (ambitious) vs target (gate).
expected:
  parseable: 0.995
  valid_name: 0.995
  expected_name: 0.950
  exact_args: 0.780
  arg_key_overlap: 0.930
  stopped_cleanly: 0.950
  recovery: 0.750
  multiturn: 0.550
  pas: 0.820

stretch:
  parseable: 1.000
  valid_name: 1.000
  expected_name: 0.970
  exact_args: 0.850
  arg_key_overlap: 0.960
  stopped_cleanly: 0.980
  recovery: 0.850
  multiturn: 0.700
  pas: 0.880

targets:  # hard gate to claim a "beat"
  parseable: 0.995
  valid_name: 0.995
  expected_name: 0.960
  exact_args: 0.850
  arg_key_overlap: 0.950
  stopped_cleanly: 0.950
  recovery: 0.800
  multiturn: 0.700
  pas: 0.880

publish:
  hf_org: eulogik
  hf_private: true
  gh_org: eulogik
  gh_private: true
